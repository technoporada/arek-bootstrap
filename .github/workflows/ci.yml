name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Akcje są przypięte do pełnego SHA, nie do ruchomego tagu.
      # Aktualizacje robi Dependabot (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Składnia bash
        run: bash -n bootstrap.sh make_project.sh tests/run.sh

      # ShellCheck jest pobierany z przypiętej wersji i weryfikowany SHA256,
      # żeby CI nie zależało od apt i ruchomego pakietu.
      - name: ShellCheck (przypięty)
        env:
          SC_VERSION: "0.10.0"
          SC_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v${SC_VERSION}/shellcheck bootstrap.sh make_project.sh tests/run.sh

      - name: Testy
        run: bash tests/run.sh

      - name: Akcje w CI są przypięte do SHA
        run: |
          set -eu
          if grep -rnE '^[[:space:]]*uses:[[:space:]]*[^#]+@(v[0-9]|main|master)([[:space:]]|$)' .github/workflows/*.yml; then
            echo "Akcja używa ruchomego tagu — przypnij do SHA." >&2
            exit 1
          fi